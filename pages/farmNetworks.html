<!DOCTYPE html>
<html>
  <head>
    <!--Metadata-->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--Title and ico-->
    <title>HAU Data Repository</title>
    <link rel="shortcut icon" href="../images/hau-logo.ico" />
    <!-- Fonts and styling-->
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="./assets/css/fontawesome.min.css" />
    <link rel="stylesheet" href="./assets/css/brands.min.css" />

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/utilities.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>

  <body>
    <!--navbar include -->
    <div id="header"></div>
    <script>
      fetch("../partials/header.html")
        .then((res) => res.text())
        .then((html) => {
          document.getElementById("header").innerHTML = html;

          const script = document.createElement("script");
          script.src = "../js/main.js?v=3"; // cache-bust
          script.onload = function () {
            if (typeof initNavbar === "function") {
              initNavbar();
            } else {
              console.error("initNavbar not defined");
            }
          };
          document.body.appendChild(script);
        });
    </script>
    <main>
      <!-- Hero -->
      <section class="hero hero-biodiversity">
        <div class="container">
          <div class="hero-content text-center">
            <h1 class="text-xxl mb-3">Harper Adams Farm Networks</h1>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer include -->
    <div id="footer"></div>
    <script>
      fetch("../partials/footer.html")
        .then((res) => res.text())
        .then((html) => (document.getElementById("footer").innerHTML = html));
    </script>
  </body>
</html>
