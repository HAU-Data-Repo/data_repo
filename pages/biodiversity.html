<!DOCTYPE html>
<html>
  <head>
    <!--Metadata-->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--Title and ico-->
    <title>HAU Data Repository</title>
    <link rel="shortcut icon" href="../images/hau-logo.ico" />
    <!-- Fonts and styling-->
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="./assets/css/fontawesome.min.css" />
    <link rel="stylesheet" href="./assets/css/brands.min.css" />

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/utilities.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>

  <body>
    <!--navbar include -->
    <div id="header"></div>
    <script>
      fetch("../partials/header.html")
        .then((res) => res.text())
        .then((html) => {
          document.getElementById("header").innerHTML = html;

          const script = document.createElement("script");
          script.src = "../js/main.js?v=3"; // cache-bust
          script.onload = function () {
            if (typeof initNavbar === "function") {
              initNavbar();
            } else {
              console.error("initNavbar not defined");
            }
          };
          document.body.appendChild(script);
        });
    </script>

    <main>
      <!-- Hero -->
      <section class="hero hero-biodiversity">
        <div class="container">
          <div class="hero-content text-center">
            <h1 class="text-xxl mb-3">Harper Adams Biodiversity</h1>
          </div>
        </div>
      </section>

      <!-- Data Categories -->
      <section class="data-categories mb-3">
        <div class="container">
          <h3 class="text-xl text-center mb-3">Explore our biodiversity</h3>
          <div class="grid-3 gap-1">
            <a href="" target="_blank" class="card-link-wrapper">
              <div class="card text-center">
                <img
                  src="../images/annie-spratt-gwSPvpXnNiU-unsplash.jpg"
                  alt="Close up of buttercups in a field taken at dawn with blurred background. Rights to Annie Spratt"
                  class="card-img"
                />
                <p class="text-lg text-center">Habitats</p>
              </div>
            </a>

            <a href="" target="_blank" class="card-link-wrapper">
              <div class="card text-center">
                <img src="../images/HAU GR 3_00_20250305183508.jpg" alt="" class="card-img" />
                <p class="text-lg text-center">Species</p>
              </div>
            </a>

            <a href="" class="card-link-wrapper">
              <div class="card text-center">
                <img src="../images/apirary.jpg" alt="" class="card-img" />
                <p class="text-lg text-center">Apiary</p>
              </div>
            </a>

            <a href="" class="card-link-wrapper">
              <div class="card text-center">
                <img src="../images/sandra-seitamaa-2VmPsHzI5aY-unsplash.jpg" alt="" class="card-img" />
                <p class="text-lg text-center">Environmental Schemes</p>
              </div>
            </a>

            <a href="" target="_blank" class="card-link-wrapper">
              <div class="card text-center">
                <img src="../images/aphids.jpg" alt="" class="card-img" />
                <p class="text-lg text-center">Rothamsted Moths & Aphids</p>
              </div>
            </a>

            <a href="" class="card-link-wrapper">
              <div class="card text-center">
                <img src="../images/data.jpg" alt="" class="card-img" />
                <p class="text-lg text-center">Relevant documents</p>
              </div>
            </a>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer include -->
    <div id="footer"></div>
    <script>
      fetch("../partials/footer.html")
        .then((res) => res.text())
        .then((html) => (document.getElementById("footer").innerHTML = html));
    </script>
  </body>
</html>
