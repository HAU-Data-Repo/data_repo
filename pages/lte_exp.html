<!DOCTYPE html>
<html>
  <head>
    <!--Metadata-->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--Title and ico-->
    <title>HAU Data Repository</title>
    <link rel="shortcut icon" href="../images/hau-logo.ico" />
    <!-- Fonts and styling-->
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="./assets/css/fontawesome.min.css" />
    <link rel="stylesheet" href="./assets/css/brands.min.css" />

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/utilities.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>

  <body>
    <!--navbar include -->
    <div id="header"></div>
    <script>
      fetch("../partials/header.html")
        .then((res) => res.text())
        .then((html) => {
          document.getElementById("header").innerHTML = html;

          const script = document.createElement("script");
          script.src = "../js/main.js?v=3"; // cache-bust
          script.onload = function () {
            if (typeof initNavbar === "function") {
              initNavbar();
            } else {
              console.error("initNavbar not defined");
            }
          };
          document.body.appendChild(script);
        });
    </script>

    <main>
      <!-- Hero -->
      <section class="hero hero-lte">
        <div class="container">
          <div class="hero-content text-center">
            <h1 class="text-xxl mb-3">Harper Adams Long-Term Experiments</h1>
          </div>
        </div>
      </section>

      <!-- Data Categories -->
      <section class="data-categories mb-3">
        <div class="container">
          <h3 class="text-xl text-center mb-3">Explore our long-term experiments</h3>
          <div class="grid-4 gap-1">
            <a href="../pages/lte_projects/TrafficAndTillage.html" class="card-link-wrapper">
              <div class="card text-center">
                <img src="../images/Crops-header.jpg" alt="" class="card-img" />
                <p class="text-lg text-center">Traffic & Tillage</p>
              </div>
            </a>

            <a href="../pages/lte_projects/HandsFreeFarm.html" class="card-link-wrapper">
              <div class="card text-center">
                <img src="../images/HFF.jpeg" alt="" class="card-img" />
                <p class="text-lg text-center">Hands Free Farm</p>
              </div>
            </a>

            <a href="../pages/lte_projects/ConventionalVsRegen.html" class="card-link-wrapper">
              <div class="card text-center">
                <img src="../images/combine.jpeg" alt="" class="card-img" />
                <p class="text-lg text-center">Conventional Vs. Regenerative Agriculture</p>
              </div>
            </a>

            <a href="../pages/lte_projects/PaludicultureInnovationProject.html" class="card-link-wrapper">
              <div class="card text-center">
                <img src="../images/pip_site.jpg" alt="" class="card-img" />
                <p class="text-lg text-center">Paludiculture Innovation Project</p>
              </div>
            </a>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer include -->
    <div id="footer"></div>
    <script>
      fetch("../partials/footer.html")
        .then((res) => res.text())
        .then((html) => (document.getElementById("footer").innerHTML = html));
    </script>
  </body>
</html>
