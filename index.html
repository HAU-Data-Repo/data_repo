<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Metadata -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore the Future Farm Data & See What You Can Discover" />
    <meta name="keywords" content="Future Farm, Harper Adams University, Data Portal, Data Repository" />

    <!-- Title and Icon -->
    <title>HAU Data Repository</title>
    <link rel="shortcut icon" href="./images/hau-logo.ico" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="./assets/css/fontawesome.min.css" />
    <link rel="stylesheet" href="./assets/css/brands.min.css" />

    <!-- CSS -->
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/utilities.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body>
    <!--navbar include -->
    <div id="header"></div>
    <script>
      fetch("./partials/header.html")
        .then((res) => res.text())
        .then((html) => {
          const header = document.getElementById("header");
          header.innerHTML = html;

          // Manually load navbar.js after HTML is injected
          const script = document.createElement("script");
          script.src = "./js/navbar.js";
          script.onload = function () {
            if (typeof initDropdownNav === "function") {
              initDropdownNav();
            } else {
              console.error("initDropdownNav is not defined.");
            }
          };
          document.body.appendChild(script);
        });
    </script>

    <main>
      <!-- Hero -->
      <section class="hero">
        <div class="container">
          <div class="hero-content text-center">
            <h1 class="text-xxl mb-2">Harper Adams Future Farm Data Portal</h1>
            <p class="text-md">Explore the Future Farm Data & See What You Can Discover</p>
          </div>
        </div>
      </section>

      <!-- Data Categories -->
      <section class="data-categories mb-3">
        <div class="container">
          <h3 class="text-xl text-center mb-3">Explore our data</h3>
          <div class="grid-3 gap-1">
            <a href="https://harperadams.farmmetrics.net/app/login?returnUrl=%2Fdashboard" target="_blank" class="card-link-wrapper">
              <div class="card text-center">
                <img src="./images/Crops-header.jpg" alt="Farm Data" class="card-img" />
                <p class="text-lg">Farm Data <i class="fa-solid fa-up-right-from-square fa-2xs"></i></p>
              </div>
            </a>

            <a href="https://hacarbon.github.io/dash/index.html#" target="_blank" class="card-link-wrapper">
              <div class="card text-center">
                <img src="./images/soils.jpg" alt="Carbon" class="card-img" />
                <p class="text-lg">Carbon <i class="fa-solid fa-up-right-from-square fa-2xs"></i></p>
              </div>
            </a>

            <a href="./pages/biodiversity.html" class="card-link-wrapper">
              <div class="card text-center">
                <img src="./images/HAU GR 3_00_20250305183508.jpg" alt="Biodiversity" class="card-img" />
                <p class="text-lg">Biodiversity</p>
              </div>
            </a>

            <a href="./pages/lte_exp.html" class="card-link-wrapper">
              <div class="card text-center">
                <img src="./images/combine.jpeg" alt="Long-term Experiments" class="card-img" />
                <p class="text-lg">Long-term Experiments</p>
              </div>
            </a>

            <a href="https://dataverse.harvard.edu/dataverse/Agridat" target="_blank" class="card-link-wrapper">
              <div class="card text-center">
                <img src="./images/trials picture 2.jpeg" alt="Harper Data Verse" class="card-img" />
                <p class="text-lg">Harper Data Verse <i class="fa-solid fa-up-right-from-square fa-2xs"></i></p>
              </div>
            </a>

            <a href="./pages/farmNetworks.html" class="card-link-wrapper">
              <div class="card text-center">
                <img src="./images/Student-outdoor-lecture.jpg" alt="Farm Networks" class="card-img" />
                <p class="text-lg">Farm Networks</p>
              </div>
            </a>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer include -->
    <div id="footer"></div>
    <script>
      fetch("./partials/footer.html")
        .then((res) => res.text())
        .then((html) => (document.getElementById("footer").innerHTML = html));
    </script>
  </body>
</html>
